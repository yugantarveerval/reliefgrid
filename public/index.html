<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d6e6e"><link rel="manifest" href="/manifest.json"><link rel="icon" href="/icon.svg"><link rel="apple-touch-icon" href="/icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes"><title>ReliefGrid</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#eef3f1;--sf:#fff;--tx:#10262b;--mu:#5c7378;--ln:#cfdcd9;--ac:#0d6e6e;--cr:#d6402b;--hi:#e8a317;--ok:#2f8f5b}
@media(prefers-color-scheme:dark){:root{--bg:#0c1a1d;--sf:#13272b;--tx:#e6f0ee;--mu:#8fa8ac;--ln:#254044;--ac:#3fc1b5;--cr:#ff6a52;--hi:#f3b83c;--ok:#4fc98a}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:2px solid var(--ac)}
h1{margin:0;font-size:19px}#live{font-size:12px;color:var(--mu)}#live i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--cr);margin-right:5px}#live.on i{background:var(--ok)}
main{flex:1;overflow:auto;padding:12px}
#map{height:55vh;min-height:300px;border-radius:8px;border:1px solid var(--ln);z-index:0}
.box{background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:12px;margin:12px 0}h2{margin:0 0 8px;font-size:16px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.st{background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:6px 10px}.st b{font-size:22px;display:block}.st span{font-size:12px;color:var(--mu)}
.row{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--ln)}.row:first-of-type{border-top:0}.grow{flex:1;min-width:0}
.sc{min-width:42px;height:28px;text-align:center;line-height:28px;border-radius:6px;font-weight:800;color:#fff}.mu{color:var(--mu);font-size:13px}
.tag{font-size:12px;padding:1px 8px;border:1px solid var(--ln);border-radius:10px;margin-right:4px}
label{display:block;font-size:13px;color:var(--mu);margin:8px 0 3px}input,select,textarea{width:100%;padding:9px;border:1px solid var(--ln);border-radius:6px;background:var(--bg);color:var(--tx);font:inherit}
.btn{background:var(--ac);color:var(--bg);border:0;padding:9px 14px;border-radius:6px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}.btn.s{background:none;border:1px solid var(--ln);color:var(--tx);padding:4px 9px;font-size:13px;font-weight:400}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.bar{height:8px;background:var(--ln);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%}
.alert{border-left:4px solid var(--cr);padding:5px 9px;margin:6px 0}
nav{display:flex;border-top:1px solid var(--ln);background:var(--sf);padding-bottom:env(safe-area-inset-bottom)}nav button{flex:1;padding:12px 2px;background:none;border:0;color:var(--mu);font:inherit;font-size:13px}nav button.on{color:var(--ac);font-weight:700;box-shadow:inset 0 2px var(--ac)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--hi)}
</style></head><body>
<header><h1>ReliefGrid</h1><span><button class="btn s" id="who" onclick="login()"></button> <span id="live"><i></i><span id="lt">connecting</span></span></span></header>
<main id="app"></main>
<nav id="nav"></nav>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const CATS=["medical","food","water","shelter","rescue"],PER={medical:.5,food:1,water:3,shelter:1,rescue:0};
let S={needs:[],vols:[],res:[]},tab="map",M=null,map=null,layer=null,pick=null,pickMk=null,view=[28.61,77.21,11],draft={};
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let tok=localStorage.getItem("rgtok")||"",role=tok.split(".")[0]||"public";const C=()=>role==="coord",V=()=>role==="coord"||role==="vol";
const api=async(m,p,b)=>{const r=await fetch("/api/"+p,{method:m,headers:{"Content-Type":"application/json",Authorization:"Bearer "+tok},body:b?JSON.stringify(b):undefined});if(r.status===403||r.status===429){alert((await r.json().catch(()=>({}))).error||"Not allowed")}return r};
async function login(){if(V()){tok="";localStorage.removeItem("rgtok");location.reload();return}const pin=prompt("Enter coordinator or volunteer PIN");if(!pin)return;const r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({pin})});if(!r.ok){alert("Wrong PIN");return}const j=await r.json();localStorage.setItem("rgtok",j.token);location.reload()}
const hrs=n=>(Date.now()-n.t)/36e5;
const km=(a,b)=>{const R=6371,d=Math.PI/180,x=(b.lat-a.lat)*d,y=(b.lng-a.lng)*d,h=Math.sin(x/2)**2+Math.cos(a.lat*d)*Math.cos(b.lat*d)*Math.sin(y/2)**2;return 2*R*Math.asin(Math.sqrt(h))};
// ML: Naive Bayes trained offline on 60,000 labelled samples (train.py). Runs fully in the browser.
const feats=t=>{const w=(t.toLowerCase().match(/[a-z0-9]+/g)||[]);return new Set([...w,...w.slice(1).map((x,i)=>w[i]+"_"+x),...w.filter(x=>x.length>=5).map(x=>"p:"+x.slice(0,5))])};
function nb(m,f){let b=null;for(const l of m.labels){let s=m.prior[l]+m.ln[l];const W=m.w[l];f.forEach(x=>{if(x in W)s+=W[x]});if(!b||s>b[0])b=[s,l]}return b[1]}
const VUL=/child|baby|elder|old man|senior|pregnan|disabled|wheelchair|bachch|bujurg/i;
function classify(t){const f=feats(t),n=t.match(/\d+/);return{act:M.action?nb(M.action,f):"yes",cat:nb(M.category,f),sev:+nb(M.severity,f),vuln:VUL.test(t),people:n?Math.min(999,+n[0]):1}}
const prio=n=>Math.round(100/(1+Math.exp(-(-2.2+.7*n.sev+.9*Math.log10(n.people+1)+.8*(n.vuln?1:0)+.12*Math.min(hrs(n),24)))));
const col=p=>p>=75?"var(--cr)":p>=50?"var(--hi)":"var(--ok)";
function match(){let c=0;for(const n of S.needs.filter(n=>n.st==="open").sort((a,b)=>prio(b)-prio(a))){let best=null,bc=1e9;for(const v of S.vols.filter(v=>v.free)){const k=km(v,n)+(v.skill===n.cat?0:80);if(k<bc){bc=k;best=v}}
 if(best&&bc<80){n.st="assigned";n.vol=best.id;best.free=false;best.task=n.id;api("POST","needs",n);api("POST","vols",best);c++}}return c}
function forecast(){return CATS.filter(c=>PER[c]).map(c=>{const d=Math.round(S.needs.filter(n=>n.cat===c&&n.st!=="done").reduce((a,n)=>a+n.people*PER[c]*(n.sev>=4?1.3:1),0)),s=S.res.filter(r=>r.cat===c).reduce((a,r)=>a+r.qty,0);return{c,d,s,g:Math.max(0,d-s)}})}
const nav=(n)=>`https://www.google.com/maps/dir/?api=1&destination=${n.lat},${n.lng}`;
function row(n,acts=true){const p=prio(n),v=S.vols.find(v=>v.id===n.vol);return`<div class="row"><div class="sc" style="background:${col(p)}">${p}</div><div class="grow">${esc(n.text)}<div class="mu"><span class="tag">${n.cat}</span>${n.src&&n.src!=="app"?`<span class="tag">${n.src}</span>`:""}${n.review?`<span class="tag" style="color:var(--hi)">needs review</span>`:""}${n.noloc?`<span class="tag" style="color:var(--cr)">needs location</span>`:""}${n.people} people · sev ${n.sev}${n.vuln?" · vulnerable":""} · ${Math.round(hrs(n))}h</div>${V()&&n.contact?`<div class="mu">Contact: ${esc(n.contact)}</div>`:""}${n.st==="assigned"&&v?`<div class="mu">Assigned: ${esc(v.name)} (${km(v,n).toFixed(1)} km)</div>`:""}${n.st==="done"?'<div class="mu">Resolved</div>':""}</div>${acts&&n.st!=="done"?`<div><a class="btn s" target="_blank" rel="noopener" href="${nav(n)}">Navigate</a> ${V()?`<button class="btn s" onclick="resolve('${n.id}')">Resolve</button>`:""}</div>`:""}</div>`}
function resolve(id){const n=S.needs.find(n=>n.id===id);n.st="done";const v=S.vols.find(v=>v.id===n.vol);if(v){v.free=true;v.task=null;api("POST","vols",v)}api("POST","needs",n)}
function drawMap(el,pickable){
 if(map){map.remove();map=null}
 map=L.map(el).setView(pick?[pick.lat,pick.lng]:[view[0],view[1]],view[2]);
 const osm=L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(map);
 const sat=L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",{maxZoom:19,attribution:"Esri"});
 L.control.layers({Street:osm,Satellite:sat}).addTo(map);
 layer=L.layerGroup().addTo(map);
 S.needs.filter(n=>n.st!=="done").forEach(n=>{const p=prio(n);L.circleMarker([n.lat,n.lng],{radius:7+p/12,color:"#fff",weight:1.5,fillColor:n.st==="open"?(p>=75?"#d6402b":p>=50?"#e8a317":"#2f8f5b"):"#0d6e6e",fillOpacity:.9}).addTo(layer).bindPopup(`<b>${esc(n.cat)}</b> · priority ${p}<br>${esc(n.text)}<br><a target="_blank" rel="noopener" href="${nav(n)}">Open in Google Maps</a> · <a target="_blank" rel="noopener" href="https://maps.apple.com/?daddr=${n.lat},${n.lng}">Apple Maps</a>`);
  const v=S.vols.find(v=>v.id===n.vol);if(v)L.polyline([[v.lat,v.lng],[n.lat,n.lng]],{color:"#0d6e6e",dashArray:"4",weight:2}).addTo(layer)});
 S.vols.forEach(v=>L.marker([v.lat,v.lng],{icon:L.divIcon({className:"",html:`<div style="width:14px;height:14px;background:${v.free?"#0d6e6e":"#777"};border:2px solid #fff;border-radius:3px"></div>`})}).addTo(layer).bindPopup(`${esc(v.name)} · ${v.skill} · ${v.free?"available":"on task"}`));
 map.on("moveend",()=>{const c=map.getCenter();view=[c.lat,c.lng,map.getZoom()]});
 if(pickable){map.on("click",e=>{pick={lat:e.latlng.lat,lng:e.latlng.lng};if(pickMk)pickMk.remove();pickMk=L.marker(e.latlng).addTo(map);$("#loc").textContent=`Location set: ${pick.lat.toFixed(4)}, ${pick.lng.toFixed(4)}`});if(pick)pickMk=L.marker([pick.lat,pick.lng]).addTo(map)}}
function here(){navigator.geolocation?.getCurrentPosition(p=>{pick={lat:p.coords.latitude,lng:p.coords.longitude};view=[pick.lat,pick.lng,14];render()},()=>alert("Location permission denied. Tap the map to set the location."))}
function render(){
 $("#nav").innerHTML=[["map","Map"],["needs","Needs"],["report","Report"],["vols","Volunteers"],["res","Stock"]].map(([k,l])=>`<button class="${tab===k?"on":""}" onclick="tab='${k}';render()">${l}</button>`).join("");
 const open=S.needs.filter(n=>n.st==="open"),a=$("#app");
 if(tab==="map"){const f=forecast();a.innerHTML=`<div class="stats"><div class="st"><b>${open.length}</b><span>Open</span></div><div class="st"><b style="color:var(--cr)">${open.filter(n=>prio(n)>=75).length}</b><span>Critical</span></div><div class="st"><b>${S.vols.filter(v=>v.free).length}/${S.vols.length}</b><span>Free</span></div><div class="st"><b>${S.needs.filter(n=>n.st==="done").length}</b><span>Done</span></div></div><div id="map" style="margin-top:12px"></div>
 <div class="box"><h2>Shortage forecast</h2>${f.map(x=>`<div style="margin-bottom:7px"><div style="display:flex;justify-content:space-between"><span>${x.c}</span><span class="mu">need ${x.d} · stock ${x.s}</span></div><div class="bar"><i style="width:${Math.min(100,x.d?x.s/x.d*100:100)}%;background:${x.g?"var(--cr)":"var(--ok)"}"></i></div></div>`).join("")}${f.filter(x=>x.g).map(x=>`<div class="alert">Short by ${x.g} units of ${x.c}</div>`).join("")}</div>
 <div class="box"><h2>Top priorities</h2>${[...open].sort((a,b)=>prio(b)-prio(a)).slice(0,3).map(n=>row(n,false)).join("")||'<p class="mu">No open needs.</p>'}${C()?`<button class="btn" onclick="alert(match()+' assignment(s) made')">Auto-match volunteers</button>`:'<p class="mu">Log in as coordinator to auto-match volunteers.</p>'}</div>`;drawMap("map",false)}
 else if(tab==="needs"){a.innerHTML=`<div class="box"><h2>All needs, ranked by AI priority</h2>${[...S.needs].sort((a,b)=>(a.st==="done")-(b.st==="done")||prio(b)-prio(a)).map(n=>row(n)).join("")||'<p class="mu">Nothing reported yet.</p>'}</div>`}
 else if(tab==="report"){a.innerHTML=`<div class="box"><h2>Report a need</h2><label for="nt">What is happening? (English or Hinglish)</label><textarea id="nt" rows="3" placeholder="e.g. 5 log chhat par fase hain, bachche bhi hain, turant">${esc(draft.t||"")}</textarea><button class="btn s" onclick="ai()" style="margin-top:6px">Analyse with AI</button>
 <div class="two"><div><label>Category</label><select id="nc">${CATS.map(c=>`<option ${draft.c===c?"selected":""}>${c}</option>`).join("")}</select></div><div><label>People</label><input id="np" type="number" min="1" value="${draft.p||1}"></div><div><label>Severity 1–5</label><input id="ns" type="number" min="1" max="5" value="${draft.s||3}"></div><div><label>Vulnerable?</label><select id="nv"><option value="0">No</option><option value="1" ${draft.v?"selected":""}>Yes</option></select></div></div>
 <p id="aiout" class="mu">${esc(draft.msg||"")}</p><button class="btn s" onclick="keep();here()">Use my location</button> <span id="loc" class="mu">${pick?`Location set: ${pick.lat.toFixed(4)}, ${pick.lng.toFixed(4)}`:"Tap the map to set the location"}</span><div id="map" style="height:260px;margin-top:8px"></div><button class="btn" style="margin-top:10px" onclick="addNeed()">Submit need</button></div>`;drawMap("map",true)}
 else if(tab==="vols"){a.innerHTML=`<div class="box"><h2>Volunteers</h2>${S.vols.map(v=>`<div class="row"><div class="grow"><b>${esc(v.name)}</b><div class="mu"><span class="tag">${v.skill}</span>${v.free?"Available":"On task"}</div></div>${C()?`<button class="btn s" onclick="api('DELETE','vols/${v.id}')">Remove</button>`:""}</div>`).join("")}</div>${V()?`<div class="box"><h2>Register volunteer</h2><label for="vn">Name</label><input id="vn"><label>Skill</label><select id="vs">${CATS.map(c=>`<option>${c}</option>`).join("")}</select><button class="btn" style="margin-top:10px" onclick="addVol()">Register with my location</button></div>`:'<p class="mu">Log in to register volunteers.</p>'}`}
 else{if(!C()){a.innerHTML='<div class="box"><h2>Stock</h2><p class="mu">Coordinators only. Tap Log in and enter the coordinator PIN.</p></div>';return}a.innerHTML=`<div class="box"><h2>Stock</h2>${S.res.map(r=>`<div class="row"><div class="grow">${esc(r.name)}<div class="mu">${r.cat}</div></div><input type="number" min="0" value="${r.qty}" style="width:80px" aria-label="Quantity of ${esc(r.name)}" onchange="api('POST','res',{...S.res.find(x=>x.id==='${r.id}'),qty:+this.value})"><button class="btn s" onclick="api('DELETE','res/${r.id}')">Remove</button></div>`).join("")}</div><div class="box"><h2>Add stock</h2><label for="rn">Item</label><input id="rn"><label>Type</label><select id="rc">${CATS.map(c=>`<option>${c}</option>`).join("")}</select><label>Quantity</label><input id="rq" type="number" value="10"><button class="btn" style="margin-top:10px" onclick="addRes()">Add</button></div>`}}
const keep=()=>{draft={t:$("#nt").value,c:$("#nc").value,p:+$("#np").value,s:+$("#ns").value,v:$("#nv").value==="1",msg:draft.msg}};
function ai(){const r=classify($("#nt").value);draft={t:$("#nt").value,c:r.cat,p:r.people,s:r.sev,v:r.vuln,msg:`AI suggests ${r.cat}, severity ${r.sev}, ${r.people} people. Review before submitting.`+(r.act==="no"?" This reads more like general news or sympathy than a request for help. Add detail if you need help.":"")};render()}
async function addNeed(){const t=$("#nt").value.trim();if(!t||!pick){alert("Describe the situation and set a location first.");return}
 await api("POST","needs",{text:t,cat:$("#nc").value,people:+$("#np").value||1,sev:Math.min(5,Math.max(1,+$("#ns").value||3)),vuln:$("#nv").value==="1",lat:pick.lat,lng:pick.lng,t:Date.now(),st:"open"});draft={};pick=null;tab="needs";render()}
function addVol(){const n=$("#vn").value.trim();if(!n){alert("Enter a name.");return}const go=(lat,lng)=>{api("POST","vols",{name:n,skill:$("#vs").value,lat,lng,free:true})};navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>go(p.coords.latitude,p.coords.longitude),()=>go(view[0],view[1])):go(view[0],view[1])}
function addRes(){const n=$("#rn").value.trim();if(!n){alert("Enter an item.");return}api("POST","res",{name:n,cat:$("#rc").value,qty:+$("#rq").value||0})}
function connect(){$("#who").textContent=V()?(C()?"Coordinator · log out":"Volunteer · log out"):"Log in";const es=new EventSource("/api/stream?token="+encodeURIComponent(tok));es.onopen=()=>{$("#live").className="on";$("#lt").textContent="live"};es.onerror=()=>{$("#live").className="";$("#lt").textContent="reconnecting"};
 es.onmessage=e=>{S=JSON.parse(e.data);const ed=document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);if(!ed&&tab!=="report")render()}}
fetch("/model.json").then(r=>r.json()).then(m=>M=m);connect();render();
if("serviceWorker"in navigator)navigator.serviceWorker.register("/sw.js");
</script></body></html>
